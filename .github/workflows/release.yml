name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Build and run tests
        run: |
          make
          make test

      - name: Package release
        run: |
          mkdir -p release/megaman99
          cp megaman99 release/megaman99/
          cp -r assets release/megaman99/ 2>/dev/null || true
          cp README.md release/megaman99/ 2>/dev/null || true
          cp LICENSE release/megaman99/ 2>/dev/null || true
          cd release && tar -czf megaman99-linux-x86_64.tar.gz megaman99/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/megaman99-linux-x86_64.tar.gz
          generate_release_notes: true
